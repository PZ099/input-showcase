name: Update cloud model catalog

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: Published model Release tag (models-*)
        type: string
        required: true

permissions: {}

concurrency:
  group: model-catalog-main
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'models-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image decoder from official PyPI
        run: |
          python -m pip install --disable-pip-version-check --index-url https://pypi.org/simple --only-binary=:all: 'Pillow>=11,<14'
      - name: Validate all model ZIPs and merge catalogs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: python tools/update_catalog.py --tag "$MODEL_TAG" --renderer-version 2
      - name: Commit validated catalog to main
        env:
          MODEL_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud/catalog.json cloud/catalog.sha256 dist/models.json
          if git diff --cached --quiet; then
            echo 'Catalog already current.'
          else
            git commit -m "Update cloud models from $MODEL_TAG"
          fi
          for attempt in 1 2 3; do
            if ! git fetch origin main:refs/remotes/origin/main; then
              echo "::warning::Fetch failed (attempt $attempt/3)."
              sleep "$((attempt * 2))"
              continue
            fi
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo '::error::Catalog rebase conflicts with main. Resolve the content conflict before retrying; no force push was attempted.'
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::Push failed or main advanced (attempt $attempt/3)."
            sleep "$((attempt * 2))"
          done
          echo '::error::Could not publish the validated catalog after 3 safe attempts. Run the workflow again.'
          exit 1

